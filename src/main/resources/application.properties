# Server Configuration
server.port=8085
# server.servlet.context-path=/api

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Application Name
spring.application.name=bedhcd

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/dhcd
spring.datasource.username=postgres
spring.datasource.password=thanh48
# spring.datasource.url=jdbc:postgresql://10.16.3.95:5432/dhcd
# spring.datasource.username=dhcd
# spring.datasource.password=OdQpfy1dU9ZUfVL1BTFiLYqNY

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh
spring.jackson.time-zone=Asia/Ho_Chi_Minh

# Hibernate JDBC Batch Insert/Update - Tăng throughput 5-10x
spring.jpa.properties.hibernate.jdbc.batch_size=500
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true

# HikariCP Connection Pool - Đủ connection cho ThreadPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# Spring Security Default User
spring.security.user.name=admin
spring.security.user.password=admin

# JWT Configuration
jwt.secret=YourSuperSecretKeyForJWTTokenGenerationMustBeLongEnoughForHS512Algorithm
jwt.access-token-expiration=604800000
jwt.refresh-token-expiration=604800000


# Kafka Configuration
spring.kafka.bootstrap-servers=10.16.3.95:9092
# spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.group-id=voting-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.api.bedhcd.dto.response,com.api.bedhcd.dto.event
spring.kafka.template.default-topic=vote_events
# Logging Configuration
logging.level.org.springframework.web.socket=DEBUG

# SpringDoc OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.writer-with-default-pretty-printer=true
springdoc.show-actuator=true


# Actuator & Prometheus Configuration
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=always

# Async Configuration
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=5
spring.task.execution.pool.queue-capacity=10

# Import Temp Directory
app.import.temp-dir=${java.io.tmpdir}/bedhcd-imports

# Disable DevTools Restart
spring.devtools.restart.enabled=false